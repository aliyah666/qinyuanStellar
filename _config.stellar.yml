# Stellar 主题级配置（最小可用）
# 官方文档：https://xaoxuu.com/wiki/stellar/
# 说明：第一轮仅配置最小导航 + 关闭评论；个性化（评论 Twikoo、字体等）放第二轮。

menubar:
  columns: 3
  items:
    - id: post
      title: 博客
      url: /
    - id: talks
      title: 说说
      url: /talks/
    - id: about
      title: 关于
      url: /about/

comments:
  service: twikoo
  twikoo:
    js: https://registry.npmmirror.com/twikoo/1.7.19/files/dist/twikoo.all.min.js
    envId: https://comment.qinyuan.me

# 引入霞鹜文楷 Screen Web（切片版，异步加载不阻塞渲染）
# link 注入到 <head>；正文字体在下方 style.font-family（Stylus 读 theme.config，故写在此处）
inject:
  head:
    - "<link rel=\"stylesheet\" href=\"https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css\" media=\"print\" onload=\"this.media='all'\">"
    # 覆盖主题 scrollreveal 的 visibility:hidden（会阻断 vanilla-lazyload 视口检测导致图片空白）；隐藏交给 ScrollReveal 内联 opacity 负责，样式表不得设 opacity:0（否则 SR4 不生成动画终点）
    - "<style>.slide-up{visibility:visible;}</style>"
    - '<link rel="stylesheet" href="https://gcore.jsdelivr.net/gh/MSCMDD/Qexo-Talks@main/Stellar/qexo_talk.css">'
    - |
      <style>
      #qexot-sidebar.tag-plugin.timeline { padding-left: 0; }
      #qexot-sidebar.tag-plugin.timeline:before { display: none; }
      #qexot-sidebar .timenode + .timenode { margin-top: 0.5rem; }
      #qexot-sidebar .timenode .header { display: none; }
      #qexot-sidebar .timenode .body { background: transparent; border-radius: 0; box-shadow: none; padding: 0; font-size: 13px; line-height: 1.6; }
      #qexot-sidebar .timenode .body .footer { padding: 0.2rem 0 0; }
      </style>
    # 左侧栏浅色模式白色遮罩：50% → 5%（对齐 Stellar 1.44 新版默认值，使侧栏透出背景图色调）
    - |
      <style>
      @media screen and (min-width: 667px) {
        .l_left .leftbar-container:before { background: rgba(255,255,255,0.05); }
      }
      </style>
  # Microsoft Clarity 访问统计（热力图/会话录屏/行为看板），Project ID: xmcrfwf5rh
  script:
    - >-
      <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xmcrfwf5rh");
      </script>
    - '<script src="https://gcore.jsdelivr.net/gh/MSCMDD/Qexo-Talks@main/Stellar/qexo_talk.js"></script>'
    - '<script>document.addEventListener("DOMContentLoaded",function(){var el=document.getElementById("qexot-sidebar");if(el&&typeof showQexoTalks==="function"){showQexoTalks("qexot-sidebar","https://admin.qinyuan.me",5);}});</script>'

style:
  font-family:
    body: '"LXGW WenKai Screen", system-ui, "Microsoft YaHei", "PingFang SC", sans-serif'
    code: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
    codeblock: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'

tag_plugins:
  image:
    fancybox: true

# Fancybox 升级至 5.0.36（修复 5.0 与外部图片URL参数冲突导致图片不显示）
plugins:
  # 页面元素滑入动画；配合 inject.head 中的 .slide-up 覆盖样式（visibility:hidden 会导致懒加载图片无法显示，故改用 opacity）
  scrollreveal:
    enable: true
    # 自包含的 ScrollReveal 初始化（复刻官方 1.36+ 修复，不依赖 1.33.1 缺失的 utils.initPlugin/utils.js）
    # 1) 不硬编码 .widgets/.l_main/.l_right 容器，常规元素用 window 滚动监听（PC/移动端均有效）
    # 2) sticky/fixed 吸顶容器内的元素按容器分组，避免被误判为不可见
    # 3) 3 秒 watchdog + sr-fallback 兜底，防止动画失败导致元素不可见
    inject: |
      <script defer src="https://gcore.jsdelivr.net/npm/scrollreveal@4.0/dist/scrollreveal.min.js"></script>
      <style>html.sr-fallback .slide-up { visibility: visible !important; }</style>
      <script>
      (function(){
        var run = function(){
          var els = Array.prototype.slice.call(document.querySelectorAll('.slide-up'));
          if (els.length === 0) return;
          function findPinnedContainer(el){
            var node = el;
            while (node && node.nodeType === 1){
              var pos = window.getComputedStyle(node).position;
              if (pos === 'sticky' || pos === 'fixed') return node;
              node = node.parentElement;
            }
            return null;
          }
          var pinnedGroups = new Map();
          var targets = [];
          els.forEach(function(el){
            var container = findPinnedContainer(el);
            if (container){
              var group = pinnedGroups.get(container) || [];
              group.push(el);
              pinnedGroups.set(container, group);
            } else {
              targets.push(el);
            }
          });
          if (pinnedGroups.size === 0 && targets.length === 0) return;
          var fallbackApplied = false;
          function revealFallback(){
            if (fallbackApplied) return;
            fallbackApplied = true;
            document.documentElement.classList.add('sr-fallback');
          }
          var slideUp = { distance:'8px', duration:'1000', interval:'100', scale:'1', opacity:0, easing:'ease-out' };
          var watchdog = setTimeout(function(){ revealFallback(); }, 3000);
          if (typeof ScrollReveal !== 'function'){ revealFallback(); return; }
          try {
            var sr = ScrollReveal();
            if (targets.length > 0) sr.reveal(targets, slideUp);
            pinnedGroups.forEach(function(group, container){
              sr.reveal(group, Object.assign({}, slideUp, { container: container }));
            });
            clearTimeout(watchdog);
          } catch(e){
            console.error('[scrollreveal] init failed', e);
            revealFallback();
          }
        };
        if (document.readyState === 'loading'){
          document.addEventListener('DOMContentLoaded', run);
        } else {
          run();
        }
      })();
      </script>
  fancybox:
    js: https://gcore.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.umd.js
    css: https://gcore.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.css

