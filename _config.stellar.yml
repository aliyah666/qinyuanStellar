# Stellar 主题级配置（最小可用）
# 官方文档：https://xaoxuu.com/wiki/stellar/
# 说明：第一轮仅配置最小导航 + 关闭评论；个性化（评论 Twikoo、字体等）放第二轮。

menubar:
  columns: 5
  items:
    - id: post
      title: 博客
      url: /
    - id: categories
      title: 分类
      url: /categories/
    - id: tags
      title: 标签
      url: /tags/
    - id: archives
      title: 归档
      url: /archives/
    - id: about
      title: 关于
      url: /about/

comments:
  service: twikoo
  twikoo:
    js: https://registry.npmmirror.com/twikoo/1.7.15/files/dist/twikoo.all.min.js
    envId: https://comment.qinyuan.me

# 引入霞鹜文楷 Screen Web（切片版，异步加载不阻塞渲染）
# link 注入到 <head>；正文字体在下方 style.font-family（Stylus 读 theme.config，故写在此处）
inject:
  head:
    - "<link rel=\"stylesheet\" href=\"https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css\" media=\"print\" onload=\"this.media='all'\">"
  # Microsoft Clarity 访问统计（热力图/会话录屏/行为看板），Project ID: xmcrfwf5rh
  script:
    - >-
      <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xmcrfwf5rh");
      </script>

style:
  font-family:
    body: '"LXGW WenKai Screen", system-ui, "Microsoft YaHei", "PingFang SC", sans-serif'
    code: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
    codeblock: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'

tag_plugins:
  image:
    fancybox: true

# Fancybox 升级至 5.0.36（修复 5.0 与外部图片URL参数冲突导致图片不显示）
plugins:
  fancybox:
    js: https://gcore.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.umd.js
    css: https://gcore.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.css
