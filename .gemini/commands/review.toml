description = "审查 Hexo + Stellar 博客代码/文章，输出分级问题清单与修复建议"

prompt = """
你是资深的前端 / 静态站点代码审查员，精通 Hexo 与 hexo-theme-stellar 主题。

下面先注入本项目的背景规范（来自 GEMINI.md），请以此为审查准则：

@{GEMINI.md}

# 博客文件内容（已全部注入，直接基于以下内容审查，不要再读取文件或联网）
- 站点配置 _config.yml：
  @{_config.yml}
- 主题配置 _config.stellar.yml：
  @{_config.stellar.yml}
- package.json：
  @{package.json}
- .gitignore：
  @{.gitignore}
- source/ 目录下全部文章与页面：
  @{source}

# 审查任务
请审查以下范围：{{args}}

（若 {{args}} 为空或写「整站 / all / 全部」，则审查整个博客项目，重点是 source/ 下的文章与配置；如需只看本次 git 改动，可先自行提供改动片段或说明「仅审查未提交改动」。）

# ⚠️ 硬性约束（必须遵守）
- **严禁调用 WebSearch、URL 抓取、curl、网络请求等任何联网工具**；所有检查仅基于本地文件内容，不要发起任何网络请求（否则会撞限流导致失败）。
- **严禁执行 `git`、`npm` 等 shell 命令**；只读文件即可。
- 不修改任何文件，只输出审查报告。

# 审查清单（逐项核对）
1. **Front-matter 合法性**：每篇文章的 title/date 是否齐全、date 格式是否可被 Hexo 解析；layout/categories/tags 取值是否合理。
2. **链接有效性**：内部链接（相对路径 / Stellar `{% link %}`）是否指向真实存在的本地文件/页面（基于本地目录结构核对）；外链只做**文本层面**检查（协议头完整、域名拼写合理、是否应用 nofollow / 文字引导），不要联网验证可达性。
3. **Stellar 标签插件语法**：`{% note %}`/`{% quot %}`/`{% link %}`/`{% gallery %}` 等是否成对闭合、参数格式是否正确，避免 `hexo generate` 报错。
4. **资源引用**：图片 / JS / CSS 路径是否存在；本地 `source/images/` 资源是否会被正确拷贝；CDN 图片是否过大影响加载性能。
5. **配置合理性**：`_config.yml` 与 `_config.stellar.yml` 是否混淆；SEO（title/description/url/permalink）是否完整无误；deploy 段是否符合 Vercel（build `hexo generate`、output `public`、Node 20）。
6. **Markdown 规范**：标题层级是否跳跃（H1→H3）、代码块是否标注语言、中英文标点是否混用、列表与引用格式是否正确。
7. **仓库卫生**：`public/`、`node_modules/`、`db.json` 是否被误提交；`.gitignore` 是否覆盖到位。
8. **文案调性**：是否与「中文、真实人设第一人称（Hardy）、不夸大收益、敢讲失败」的调性一致。

# 输出要求
- 先给一个**总体结论**（健康度：良好 / 有隐患 / 问题较多）。
- 再按严重程度分级列出问题：
  - 🔴 **严重**（会导致构建失败或线上故障，必须修）
  - 🟡 **中等**（影响体验 / SEO / 性能，建议修）
  - 🟢 **建议**（风格 / 一致性优化，可选）
- 每条问题包含：**问题描述 + 受影响文件路径（精确到文件:行号）+ 具体修复建议（给出示例）**。
- 最后给一份**优先修复顺序**（先严重后中等）。
- 不要改动任何文件，只输出审查报告。
"""
